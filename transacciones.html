<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detector de anomalías | Transacciones</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container-fluid">
      <div class="row">
        <nav class="col-md-2 d-none d-md-block sidebar p-3">
          <h4 class="text-white">Detector de anomalías</h4>
          <ul class="nav flex-column mt-4">
            <li class="nav-item">
              <a class="nav-link" href="index.html"
                ><i class="bi bi-speedometer2"></i> Inicio</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="reportes.html"
                ><i class="bi bi-bar-chart"></i> Reportes</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="#"
                ><i class="bi bi-cash-coin"></i> Transacciones</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="clientes.html"
                ><i class="bi bi-people"></i> Clientes</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="cajeros.html"
                ><i class="bi bi-device-ssd"></i> Cajeros</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="tipos_transacciones.html"
                ><i class="bi bi-wallet"></i> Tipos de transacciones</a
              >
            </li>
          </ul>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
          <nav
            class="navbar navbar-expand-lg navbar-light bg-light my-3 rounded shadow-sm"
          >
            <div class="container-fluid">
              <a class="navbar-brand" href="#">Transacciones</a>
            </div>
          </nav>

          <div class="card shadow-sm mb-3">
            <div class="card-body">
              <div class="row g-2">
                <div class="col-md-10">
                  <div class="input-group">
                    <span class="input-group-text"
                      ><i class="bi bi-search"></i
                    ></span>
                    <input
                      type="text"
                      id="searchInput"
                      class="form-control"
                      placeholder="Buscar por código, fecha, número de cuenta, cajero, tipo de transacción o monto..."
                    />
                  </div>
                </div>
                <div class="col-md-2">
                  <button
                    id="btnLimpiar"
                    class="btn btn-outline-secondary w-100"
                  >
                    <i class="bi bi-x-circle"></i> Limpiar
                  </button>
                </div>
              </div>
              <small id="searchInfo" class="text-muted mt-2 d-block"></small>
            </div>
          </div>

          <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
              <i class="bi bi-cash-coin"></i> Todas las Transacciones
            </div>
            <div class="card-body">
              <table class="table table-hover">
                <thead class="table-light">
                  <tr>
                    <th>#</th>
                    <th>Código de transacción</th>
                    <th>Fecha</th>
                    <th>Número de cuenta</th>
                    <th>Número de cajero</th>
                    <th>Tipo de transacción</th>
                    <th>Monto</th>
                  </tr>
                </thead>
                <tbody id="transacciones-tbody">
                  </tbody>
              </table>

              <nav>
                <ul class="pagination justify-content-center" id="pagination">
                  </ul>
              </nav>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="comun.js"></script>
    <script src="tabla.js"></script>
    <script>
      function formatMonto(monto) {
        if (monto === null || monto === undefined) return "0.00";
        return parseFloat(monto).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      const tabla = crearTabla({
        tbodyId: "transacciones-tbody",
        columnas: 7,
        camposBusqueda: ["id", "fecha_hora", "id_cliente", "id_cajero", "tipo_nombre", "monto"],
        renderFila: (t, indice) => `
          <td>${indice}</td>
          <td>${escapeHtml(t.id)}</td>
          <td>${escapeHtml(t.fecha_hora)}</td>
          <td>${escapeHtml(t.id_cliente)}</td>
          <td>${escapeHtml(t.id_cajero)}</td>
          <td>${escapeHtml(t.tipo_nombre)}</td>
          <td>${formatMonto(t.monto)}</td>`,
      });

      (async () => {
        try {
          const tiposMap = await cargarTiposTransacciones();
          const transacciones = await traerTodos(`${API_URL}/transacciones`);
          tabla.cargar(transacciones.map((t) => ({ ...t, tipo_nombre: tiposMap[t.id_tipo_transaccion] || t.id_tipo_transaccion })));
        } catch (error) {
          console.error("Error cargando datos:", error);
          showError("No se pudieron cargar los datos. Verifique la conexión con el servidor. " + error.message);
          tabla.cargar([]);
        }
      })();
    </script>
  </body>
</html>
