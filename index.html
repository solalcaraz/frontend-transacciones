<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detector de anomalías | Inicio</title>
    <!-- Bootstrap CSS  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <nav id="menu" class="col-md-2 d-none d-md-block sidebar p-3"></nav>
            <script src="menu.js"></script>
            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <!-- Navbar -->
                <nav class="navbar navbar-expand-lg navbar-light bg-light my-3 rounded shadow-sm">
                    <div class="container-fluid"> <a class="navbar-brand" href="#">Estadísticas</a></div>
                </nav>
                <!-- Cards grid -->
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="card text-bg-primary shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">Clientes totales</h5>
                            <div class="card-text fs-4" id="total-clientes"><div class="spinner-border spinner-border-sm text-light" role="status"></div></div>
                        </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-bg-success shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">Transacciones totales</h5>
                            <div class="card-text fs-4" id="transacciones-totales"><div class="spinner-border spinner-border-sm text-light" role="status"></div></div>
                        </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-bg-warning shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">Transacciones por minuto</h5>
                            <div class="card-text fs-4" id="transacciones-por-minuto"><div class="spinner-border spinner-border-sm text-light" role="status"></div></div>
                        </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-bg-danger shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">Clientes sospechosos</h5>
                            <div class="card-text fs-4" id="clientes-sospechosos"><div class="spinner-border spinner-border-sm text-light" role="status"></div></div>
                        </div>
                        </div>
                    </div>
                </div>
                <!-- Gráfico -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header">
                        <i class="bi bi-graph-up"></i> Gráfico de clientes sospechosos
                    </div>
                    <div class="card-body">
                        <div id="grafico-clientes" class="w-100"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="comun.js"></script>
    <script src="dashboard.js"></script>
</body>

</html>
