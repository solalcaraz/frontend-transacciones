<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detector de anomalías | Clientes</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container-fluid">
      <div class="row">
        <nav id="menu" class="col-md-2 d-none d-md-block sidebar p-3"></nav>
        <script src="menu.js"></script>

        <!-- Main content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
          <!-- Navbar -->
          <nav
            class="navbar navbar-expand-lg navbar-light bg-light my-3 rounded shadow-sm"
          >
            <div class="container-fluid">
              <a class="navbar-brand" href="#">Clientes</a>
              <button
                class="btn btn-success"
                id="btnCrearCliente"
                data-bs-toggle="modal"
                data-bs-target="#editModal"
              >
                <i class="bi bi-plus-circle"></i> Crear Nuevo Cliente
              </button>
            </div>
          </nav>

          <!-- Buscador -->
          <div class="card shadow-sm mb-3">
            <div class="card-body">
              <div class="row g-2">
                <div class="col-md-10">
                  <div class="input-group">
                    <span class="input-group-text"
                      ><i class="bi bi-search"></i
                    ></span>
                    <input
                      type="text"
                      id="searchInput"
                      class="form-control"
                      placeholder="Buscar por número de cuenta, nombre, apellido, género, ocupación o tipo de cuenta..."
                    />
                  </div>
                </div>
                <div class="col-md-2">
                  <button
                    id="btnLimpiar"
                    class="btn btn-outline-secondary w-100"
                  >
                    <i class="bi bi-x-circle"></i> Limpiar
                  </button>
                </div>
              </div>
              <small id="searchInfo" class="text-muted mt-2 d-block"></small>
            </div>
          </div>

          <!-- Tabla -->
          <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
              <i class="bi bi-people"></i> Todos los Clientes
            </div>
            <div class="card-body">
              <table class="table table-hover">
                <thead class="table-light">
                  <tr>
                    <th>#</th>
                    <th>Número de cuenta</th>
                    <th>Nombre completo</th>
                    <th>Género</th>
                    <th>Fecha de nacimiento</th>
                    <th>Ocupación</th>
                    <th>Tipo de cuenta</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody id="clientes-tbody">
                  <!-- JS genera tabla -->
                </tbody>
              </table>

              <nav>
                <ul class="pagination justify-content-center" id="pagination">
                  <!-- JS genera botones -->
                </ul>
              </nav>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Modal Editar/Crear -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="editForm">
                    <div class="modal-header">
                        <h5 class="modal-title"><i class="bi bi-people"></i> Cliente</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Número de cuenta (ID)</label>
                            <input type="text" class="form-control" id="editId" required />
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="editNombre" required />
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Apellido</label>
                            <input type="text" class="form-control" id="editApellido" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Género</label>
                            <input type="text" class="form-control" id="editGenero" required />
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Fecha de nacimiento</label>
                            <input type="date" class="form-control" id="editFechaNacimiento" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Ocupación</label>
                            <input type="text" class="form-control" id="editOcupacion" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tipo de cuenta</label>
                            <select class="form-select" id="editTipoCuenta" required>
                                <option value="" disabled>Seleccione...</option>
                                <option value="Current">Current</option>
                                <option value="Savings">Savings</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btnGuardar">Guardar cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="comun.js"></script>
    <script src="tabla.js"></script>
    <script>
      const apiBase = `${API_URL}/clientes`;

      const tabla = crearTabla({
        tbodyId: "clientes-tbody",
        columnas: 8,
        camposBusqueda: ["id", "nombre", "apellido", "genero", "ocupacion", "tipo_cuenta"],
        renderFila: (c, indice) => `
          <td>${indice}</td>
          <td data-id="${escapeHtml(c.id)}">${escapeHtml(c.id)}</td>
          <td>${escapeHtml(c.apellido)}, ${escapeHtml(c.nombre)}</td>
          <td>${escapeHtml(c.genero)}</td>
          <td>${escapeHtml(c.fecha_nacimiento)}</td>
          <td>${escapeHtml(c.ocupacion)}</td>
          <td>${escapeHtml(c.tipo_cuenta)}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary edit-btn" data-bs-toggle="modal" data-bs-target="#editModal"><i class="bi bi-pencil"></i></button>
          </td>`,
      });

      const editModal = new bootstrap.Modal(document.getElementById("editModal"));
      const editForm = document.getElementById("editForm");
      const modalTitle = document.querySelector("#editModal .modal-title");
      const btnGuardar = document.getElementById("btnGuardar");
      let modo = "crear";

      const fields = {
        id: document.getElementById("editId"),
        nombre: document.getElementById("editNombre"),
        apellido: document.getElementById("editApellido"),
        genero: document.getElementById("editGenero"),
        fecha_nacimiento: document.getElementById("editFechaNacimiento"),
        ocupacion: document.getElementById("editOcupacion"),
        tipo_cuenta: document.getElementById("editTipoCuenta"),
      };

      document.getElementById("btnCrearCliente").addEventListener("click", () => {
        modo = "crear";
        modalTitle.innerHTML = '<i class="bi bi-plus-circle"></i> Crear Nuevo Cliente';
        btnGuardar.textContent = "Crear Cliente";
        editForm.reset();
        Object.values(fields).forEach((field) => field.removeAttribute("readonly"));
        fields.id.focus();
      });

      document.addEventListener("click", (e) => {
        if (!e.target.closest(".edit-btn")) return;

        const id = e.target.closest("tr").querySelector("td[data-id]").getAttribute("data-id");
        const cliente = tabla.buscarPorId(id);
        if (!cliente) return;

        modo = "editar";
        modalTitle.innerHTML = `<i class="bi bi-pencil-square"></i> Editar Cliente: ${escapeHtml(cliente.apellido)}, ${escapeHtml(cliente.nombre)}`;
        btnGuardar.textContent = "Guardar Cambios";
        Object.entries(fields).forEach(([campo, field]) => (field.value = cliente[campo]));

        // La API solo permite modificar la ocupación y el tipo de cuenta.
        Object.values(fields).forEach((field) => field.setAttribute("readonly", true));
        fields.ocupacion.removeAttribute("readonly");
        fields.tipo_cuenta.removeAttribute("readonly");
      });

      function mensajeDeError(error) {
        if (typeof error.detail === "string") return error.detail;
        // Los errores de validación de FastAPI llegan como una lista con la ubicación de cada campo.
        if (Array.isArray(error.detail)) return error.detail.map((err) => `${err.loc.join(".")}: ${err.msg}`).join("\n");
        return JSON.stringify(error.detail ?? error, null, 2);
      }

      editForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const id = fields.id.value.trim();
        const creando = modo === "crear";
        const payload = creando
          ? {
              id,
              nombre: fields.nombre.value.trim(),
              apellido: fields.apellido.value.trim(),
              genero: fields.genero.value.trim(),
              fecha_nacimiento: fields.fecha_nacimiento.value,
              ocupacion: fields.ocupacion.value.trim(),
              tipo_cuenta: fields.tipo_cuenta.value,
            }
          : { ocupacion: fields.ocupacion.value.trim(), tipo_cuenta: fields.tipo_cuenta.value };

        try {
          const res = await fetch(creando ? `${apiBase}/` : `${apiBase}/${id}`, {
            method: creando ? "POST" : "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          if (res.ok) {
            const cliente = await res.json();
            alert(`✅ Cliente ${id} ${creando ? "creado" : "actualizado"} correctamente.`);
            editModal.hide();
            if (creando) {
              tabla.agregar(cliente);
            } else {
              tabla.actualizar(id, { ocupacion: cliente.ocupacion, tipo_cuenta: cliente.tipo_cuenta });
            }
          } else {
            const error = await res.json();
            console.error(`Error al ${modo}:`, error);
            alert(`❌ Error al ${creando ? "crear" : "actualizar"}:\n${mensajeDeError(error)}`);
          }
        } catch (err) {
          console.error(err);
          alert(`⚠️ Error de red al intentar ${creando ? "crear" : "actualizar"} el cliente.`);
        }
      });

      traerTodos(apiBase)
        .then((clientes) => tabla.cargar(clientes))
        .catch((error) => {
          console.error("Error cargando datos:", error);
          showError("No se pudieron cargar los datos. Verifique la conexión con el servidor.");
          tabla.cargar([]);
        });
    </script>
  </body>
</html>
