<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detector de anomalías | Tipos de transacciones</title> <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <nav id="menu" class="col-md-2 d-none d-md-block sidebar p-3"></nav>
            <script src="menu.js"></script>
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4"> <!-- Navbar -->
                <nav class="navbar navbar-expand-lg navbar-light bg-light my-3 rounded shadow-sm">
                    <div class="container-fluid"> <a class="navbar-brand" href="#">Tipos de transacciones</a>
                    </div>
                </nav>

                <!-- Tabla -->
                <div class="card shadow-sm">
                    <div class="card-header bg-info text-white"> <i class="bi bi-wallet"></i> Todos los Tipos de Transacciones </div>
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>Nombre</th>
                                </tr>
                            </thead>
                            <tbody id="tipos-tbody">
                                <!-- JS genera tabla -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div> <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="comun.js"></script>
    <script>
        (async () => {
            try {
                const res = await fetch(`${API_URL}/tipos_transacciones/`);
                if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
                const tipos = await res.json();
                document.getElementById("tipos-tbody").innerHTML = tipos
                    .map((t) => `<tr><td>${t.id}</td><td>${escapeHtml(t.nombre)}</td></tr>`)
                    .join("");
            } catch (error) {
                console.error("Error cargando tipos de transacciones:", error);
                showError("No se pudieron cargar los datos. Verifique la conexión con el servidor.");
            }
        })();
    </script>

</body>

</html>
