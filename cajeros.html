<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detector de anomalías | Cajeros</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container-fluid">
      <div class="row">
        <nav id="menu" class="col-md-2 d-none d-md-block sidebar p-3"></nav>
        <script src="menu.js"></script>

        <!-- Main content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
          <!-- Navbar -->
          <nav
            class="navbar navbar-expand-lg navbar-light bg-light my-3 rounded shadow-sm"
          >
            <div class="container-fluid">
              <a class="navbar-brand" href="#">Cajeros</a>
              <button
                class="btn btn-success"
                id="btnCrearCajero"
                data-bs-toggle="modal"
                data-bs-target="#createModal"
              >
                <i class="bi bi-plus-circle"></i> Crear Nuevo Cajero
              </button>
            </div>
          </nav>

          <!-- Buscador -->
          <div class="card shadow-sm mb-3">
            <div class="card-body">
              <div class="row g-2">
                <div class="col-md-10">
                  <div class="input-group">
                    <span class="input-group-text"
                      ><i class="bi bi-search"></i
                    ></span>
                    <input
                      type="text"
                      id="searchInput"
                      class="form-control"
                      placeholder="Buscar por número, nombre, ciudad, provincia o país..."
                    />
                  </div>
                </div>
                <div class="col-md-2">
                  <button
                    id="btnLimpiar"
                    class="btn btn-outline-secondary w-100"
                  >
                    <i class="bi bi-x-circle"></i> Limpiar
                  </button>
                </div>
              </div>
              <small id="searchInfo" class="text-muted mt-2 d-block"></small>
            </div>
          </div>

          <!-- Tabla -->
          <div class="card shadow-sm">
            <div class="card-header bg-warning">
              <i class="bi bi-device-ssd"></i> Todos los Cajeros
            </div>
            <div class="card-body">
              <table class="table table-hover">
                <thead class="table-light">
                  <tr>
                    <th>#</th>
                    <th>Número de cajero</th>
                    <th>Nombre</th>
                    <th>Ciudad</th>
                    <th>Provincia</th>
                    <th>País</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody id="cajeros-tbody">
                  <!-- JS genera tabla -->
                </tbody>
              </table>

              <nav>
                <ul class="pagination justify-content-center" id="pagination">
                  <!-- JS genera botones -->
                </ul>
              </nav>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Modal Crear Cajero -->
    <div class="modal fade" id="createModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="createForm">
                    <div class="modal-header">
                        <h5 class="modal-title"><i class="bi bi-pencil-square"></i> Crear Cajero</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Número de cajero</label>
                            <input type="text" class="form-control" id="createId" readonly />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="createNombre" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ciudad</label>
                            <input type="text" class="form-control" id="createCiudad" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Provincia</label>
                            <input type="text" class="form-control" id="createProvincia" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">País</label>
                            <input type="text" class="form-control" id="createPais" required />
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="comun.js"></script>
    <script src="tabla.js"></script>
    <script>
      const apiBase = `${API_URL}/cajeros`;

      const tabla = crearTabla({
        tbodyId: "cajeros-tbody",
        columnas: 7,
        camposBusqueda: ["id", "nombre", "ciudad", "provincia", "pais"],
        renderFila: (c, indice) => `
          <td>${indice}</td>
          <td data-id="${escapeHtml(c.id)}">${escapeHtml(c.id)}</td>
          <td>${escapeHtml(c.nombre)}</td>
          <td>${escapeHtml(c.ciudad)}</td>
          <td>${escapeHtml(c.provincia)}</td>
          <td>${escapeHtml(c.pais)}</td>
          <td>
            <button class="btn btn-sm btn-outline-danger delete-btn"><i class="bi bi-trash"></i></button>
          </td>`,
      });

      const createModal = new bootstrap.Modal(document.getElementById("createModal"));
      const createForm = document.getElementById("createForm");
      const createIdInput = document.getElementById("createId");

      document.getElementById("btnCrearCajero").addEventListener("click", () => {
        document.querySelector("#createModal .modal-title").innerHTML = '<i class="bi bi-plus-circle"></i> Crear Nuevo Cajero';
        createForm.reset();
        createIdInput.removeAttribute("readonly");
        createIdInput.focus();
        document.querySelector("#createForm button[type='submit']").textContent = "Crear Cajero";
      });

      document.addEventListener("click", async (e) => {
        if (!e.target.closest(".delete-btn")) return;

        const id = e.target.closest("tr").querySelector("td[data-id]").getAttribute("data-id");
        if (!confirm(`¿Estás seguro de que quieres eliminar el cajero con ID ${id}?`)) return;

        try {
          const res = await fetch(`${apiBase}/${id}`, { method: "DELETE" });
          if (res.ok) {
            alert("✅ Cajero eliminado correctamente.");
            tabla.eliminar(id);
          } else {
            const error = await res.json();
            alert(`❌ Error al eliminar:\n${error.detail || JSON.stringify(error)}`);
          }
        } catch (err) {
          console.error(err);
          alert("⚠️ Error de red al intentar eliminar el cajero.");
        }
      });

      createForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const payload = {
          id: createIdInput.value.trim(),
          nombre: document.getElementById("createNombre").value.trim(),
          ciudad: document.getElementById("createCiudad").value.trim(),
          provincia: document.getElementById("createProvincia").value.trim(),
          pais: document.getElementById("createPais").value.trim(),
        };

        try {
          const res = await fetch(`${apiBase}/`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          if (res.ok) {
            const nuevoCajero = await res.json();
            alert(`✅ Cajero ${nuevoCajero.id} creado correctamente.`);
            createModal.hide();
            tabla.agregar(nuevoCajero);
          } else {
            const error = await res.json();
            console.error("Error al crear cajero:", error);
            const mensaje = typeof error.detail === "string" ? error.detail : JSON.stringify(error.detail ?? error, null, 2);
            alert(`❌ Error al crear:\n${mensaje}`);
          }
        } catch (err) {
          console.error(err);
          alert("⚠️ Error de red al intentar crear el cajero.");
        }
      });

      traerTodos(apiBase)
        .then((cajeros) => tabla.cargar(cajeros))
        .catch((error) => {
          console.error("Error cargando datos:", error);
          showError("No se pudieron cargar los datos. Verifique la conexión con el servidor.");
          tabla.cargar([]);
        });
    </script>
  </body>
</html>
