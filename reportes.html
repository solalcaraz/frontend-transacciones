<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detector de anomalías | Reporte de clientes sospechosos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container-fluid">
      <div class="row">
        <nav class="col-md-2 d-none d-md-block sidebar p-3">
          <h4 class="text-white">Detector de anomalías</h4>
          <ul class="nav flex-column mt-4">
            <li class="nav-item">
              <a class="nav-link" href="index.html"
                ><i class="bi bi-speedometer2"></i> Inicio</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="#"
                ><i class="bi bi-bar-chart"></i> Reportes</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="transacciones.html"
                ><i class="bi bi-cash-coin"></i> Transacciones</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="clientes.html"
                ><i class="bi bi-people"></i> Clientes</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="cajeros.html"
                ><i class="bi bi-device-ssd"></i> Cajeros</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="tipos_transacciones.html"
                ><i class="bi bi-wallet"></i> Tipos de transacciones</a
              >
            </li>
          </ul>
        </nav>
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
          <nav
            class="navbar navbar-expand-lg navbar-light bg-light my-3 rounded shadow-sm"
          >
            <div class="container-fluid">
              <a class="navbar-brand" href="#">Reporte de Clientes Sospechosos</a>
            </div>
          </nav>

          <div id="clientes-search" class="card shadow-sm mb-3">
            <div class="card-body">
              <div class="row g-2">
                <div class="col-md-10">
                  <div class="input-group">
                    <span class="input-group-text"
                      ><i class="bi bi-search"></i
                    ></span>
                    <input
                      type="text"
                      id="searchInputClientes"
                      class="form-control"
                      placeholder="Buscar en clientes por ID, nombre, apellido o motivo..."
                    />
                  </div>
                </div>
                <div class="col-md-2">
                  <button
                    id="btnLimpiarClientes"
                    class="btn btn-outline-secondary w-100"
                  >
                    <i class="bi bi-x-circle"></i> Limpiar
                  </button>
                </div>
              </div>
              <small
                id="searchInfoClientes"
                class="text-muted mt-2 d-block"
              ></small>
            </div>
          </div>

          <div id="clientes-view">
            <div class="card shadow-sm">
              <div class="card-header bg-danger text-white">
                <i class="bi bi-people"></i> Clientes con Mayor Riesgo
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table table-hover align-middle">
                    <thead class="table-light">
                      <tr>
                        <th>#</th>
                        <th>ID Cliente</th>
                        <th>Nombre del Cliente</th>
                        <th>Sospechoso Por</th>
                        <th>Transacciones</th>
                      </tr>
                    </thead>
                    <tbody id="clientes-tbody">
                      <tr><td colspan="4" class="text-center text-secondary py-4">Cargando clientes sospechosos...</td></tr>
                    </tbody>
                  </table>
                </div>
                <nav>
                  <ul
                    class="pagination justify-content-center"
                    id="clientes-pagination"
                  >
                    </ul>
                </nav>
                <div
                  id="clientes-pagination-info"
                  class="text-center text-muted small mt-2"
                ></div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="comun.js"></script>
    <script>
      const CLIENTES_POR_PAGINA = 10;

      let clientesSospechosos = [];
      let clientesFiltrados = [];
      let paginaActual = 1;

      async function cargarClientesSospechosos() {
        try {
          const response = await fetch(`${API_URL}/anomalias/clientes_sospechosos`);
          if (!response.ok) throw new Error(`Error al cargar datos: ${response.status} ${response.statusText}`);
          clientesSospechosos = await response.json();
        } catch (error) {
          console.error("Error cargando clientes:", error);
          showError("No se pudieron cargar los clientes sospechosos. Verifique la conexión con el servidor.");
          clientesSospechosos = [];
        }
        clientesFiltrados = [...clientesSospechosos];
        renderClientes();
      }

      function buscarClientes() {
        const consulta = document.getElementById("searchInputClientes").value.trim().toLowerCase();
        const info = document.getElementById("searchInfoClientes");

        if (!consulta) {
          clientesFiltrados = [...clientesSospechosos];
          info.innerHTML = "";
        } else {
          clientesFiltrados = clientesSospechosos.filter(
            (c) =>
              c.id_cliente.toLowerCase().includes(consulta) ||
              c.nombre?.toLowerCase().includes(consulta) ||
              c.apellido?.toLowerCase().includes(consulta) ||
              c.sospechoso_por?.some((motivo) => motivo.toLowerCase().includes(consulta))
          );
          info.innerHTML = `<i class="bi bi-info-circle"></i> Encontrados <strong>${clientesFiltrados.length}</strong> cliente(s) sospechoso(s) para "<strong>${escapeHtml(consulta)}</strong>"`;
        }

        paginaActual = 1;
        renderClientes();
      }

      function limpiarBusqueda() {
        document.getElementById("searchInputClientes").value = "";
        buscarClientes();
      }

      function renderClientes() {
        const total = clientesFiltrados.length;
        const tbody = document.getElementById("clientes-tbody");

        if (total === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="text-center text-secondary py-4">No se encontraron clientes sospechosos.</td></tr>`;
          document.getElementById("clientes-pagination").innerHTML = "";
          document.getElementById("clientes-pagination-info").textContent = "Mostrando 0 resultados";
          return;
        }

        const inicio = (paginaActual - 1) * CLIENTES_POR_PAGINA;
        tbody.innerHTML = clientesFiltrados
          .slice(inicio, inicio + CLIENTES_POR_PAGINA)
          .map((c, i) => filaCliente(c, inicio + i + 1))
          .join("");
        renderPaginacion(total, Math.ceil(total / CLIENTES_POR_PAGINA));
      }

      function filaCliente(c, indice) {
        // El nombre viaja en la URL para mostrarlo en el detalle sin pedir de nuevo el cliente a la API.
        const params = new URLSearchParams({ id_cliente: c.id_cliente, nombre: c.nombre, apellido: c.apellido });
        return `
          <tr>
            <td>${indice}</td>
            <td class="small fw-bold">${escapeHtml(c.id_cliente)}</td>
            <td>${escapeHtml(c.nombre)} ${escapeHtml(c.apellido)}</td>
            <td>
              <ul class="list-unstyled mb-0 small">
                ${c.sospechoso_por.map((m) => `<li><i class="bi bi-dot"></i> ${escapeHtml(m)}</li>`).join("")}
              </ul>
            </td>
            <td>
              <a class="icon-link icon-link-hover text-success" href="transacciones_cliente.html?${params}"
                 title="Ver todas las transacciones de este cliente y el detalle de anomalías">
                Ver transacciones del cliente
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-right" viewBox="0 0 16 16">
                  <path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8"/>
                </svg>
              </a>
            </td>
          </tr>`;
      }

      function renderPaginacion(total, totalPaginas) {
        const paginationEl = document.getElementById("clientes-pagination");
        paginationEl.innerHTML = "";

        const desdeItem = (paginaActual - 1) * CLIENTES_POR_PAGINA + 1;
        const hastaItem = Math.min(desdeItem + CLIENTES_POR_PAGINA - 1, total);
        document.getElementById("clientes-pagination-info").textContent = `Mostrando clientes ${desdeItem}-${hastaItem} de ${total}`;

        if (totalPaginas <= 1) return;

        const item = (texto, pagina, activo = false, deshabilitado = false) => {
          const li = document.createElement("li");
          li.className = `page-item ${activo ? "active" : ""} ${deshabilitado ? "disabled" : ""}`;
          const a = document.createElement("a");
          a.href = "#";
          a.className = "page-link";
          a.textContent = texto;
          if (!deshabilitado) {
            a.addEventListener("click", (e) => {
              e.preventDefault();
              if (pagina !== paginaActual) {
                paginaActual = pagina;
                renderClientes();
              }
            });
          }
          li.appendChild(a);
          return li;
        };

        // Muestra 5 páginas centradas en la actual, corridas al principio o al final cuando no entran.
        let desde = Math.max(1, paginaActual - 2);
        let hasta = Math.min(totalPaginas, paginaActual + 2);
        if (paginaActual <= 3) {
          desde = 1;
          hasta = Math.min(totalPaginas, 5);
        } else if (paginaActual > totalPaginas - 3) {
          desde = Math.max(1, totalPaginas - 4);
          hasta = totalPaginas;
        }

        paginationEl.appendChild(item("Anterior", paginaActual - 1, false, paginaActual === 1));
        for (let i = desde; i <= hasta; i++) {
          paginationEl.appendChild(item(i, i, i === paginaActual));
        }
        paginationEl.appendChild(item("Siguiente", paginaActual + 1, false, paginaActual === totalPaginas));
      }

      const searchInput = document.getElementById("searchInputClientes");
      searchInput.addEventListener("keyup", (e) => {
        if (e.key === "Enter") buscarClientes();
        if (e.key === "Escape") limpiarBusqueda();
      });
      document.getElementById("btnLimpiarClientes").addEventListener("click", limpiarBusqueda);
      let timeoutBusqueda;
      searchInput.addEventListener("input", () => {
        clearTimeout(timeoutBusqueda);
        timeoutBusqueda = setTimeout(buscarClientes, 400);
      });

      cargarClientesSospechosos();
    </script>
  </body>
</html>
